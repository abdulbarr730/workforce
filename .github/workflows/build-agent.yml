name: Build Desktop Agent

on:
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI
  push:
    branches:
      - main # Automatically runs when you push to the main branch

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "@workforce/shared-*" run build

      - name: Write .env for renderer
        shell: bash
        run: |
          cat > apps/desktop-agent/.env <<EOF
          VITE_API_BASE_URL=https://prosync-backend.onrender.com/api
          VITE_EMPLOYEE_DASHBOARD_URL=https://prosyncteam.onrender.com/dashboard
          VITE_GH_UPDATE_TOKEN=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
          EOF

      - name: Build and Publish Windows
        if: matrix.os == 'windows-latest'
        working-directory: apps/desktop-agent
        run: pnpm run build && pnpm exec electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Mac
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop-agent
        run: pnpm run build && pnpm exec electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
