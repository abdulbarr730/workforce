name: Deploy production to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and restart Workforce
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REPO_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_HOST || secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          timeout: 60s
          command_timeout: 25m
          envs: DEPLOY_SHA,REPOSITORY,REPO_TOKEN
          debug: true
          script: |
            set -eu

            APP_DIR="${{ vars.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/var/www/workforce"; fi

            cd "$APP_DIR"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
              fetch --prune "https://github.com/$REPOSITORY.git" main
            git checkout main
            git merge --ff-only FETCH_HEAD

            corepack enable
            corepack prepare pnpm@9.1.0 --activate
            pnpm install --frozen-lockfile

            # Bound build memory: the VPS also serves production and runs Mongo.
            export NODE_OPTIONS="--max-old-space-size=1024"
            pnpm --filter @workforce/backend build
            pnpm --filter @workforce/admin-dashboard build
            pnpm --filter @workforce/employee-dashboard build
            unset NODE_OPTIONS

            # Process definitions (memory caps, heap limits) live in the repo.
            APP_DIR="$APP_DIR" pm2 startOrReload ecosystem.config.cjs --update-env

            pm2 save
            pm2 status
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Deployment summary
        if: success()
        run: echo "Deployed ${GITHUB_SHA} to the Hostinger production VPS."
