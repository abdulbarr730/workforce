name: Build Workforce Agent (.exe)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL (e.g. https://workforce-api.onrender.com)"
        required: true
        default: "http://localhost:5000"
      dashboard_url:
        description: "Employee dashboard URL (used when agent opens EOD in browser)"
        required: true
        default: "https://workforce-system-employee.vercel.app/dashboard"
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared packages
        run: pnpm --filter "@workforce/shared-*" run build

      - name: Write .env for renderer
        shell: bash
        run: |
          cat > apps/desktop-agent/.env <<EOF
          VITE_API_BASE_URL=${{ github.event.inputs.api_url || 'https://workforce-system-backend.vercel.app/api' }}
          VITE_EMPLOYEE_DASHBOARD_URL=${{ github.event.inputs.dashboard_url || 'https://workforce-system-employee.vercel.app/dashboard' }}
          VITE_GH_UPDATE_TOKEN=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
          EOF

      - name: Build and Publish Windows installer
        working-directory: apps/desktop-agent
        run: pnpm run build && pnpm exec electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Agent-Installer
          path: |
            apps/desktop-agent/dist-installer/*.exe
            apps/desktop-agent/dist-installer/latest.yml


  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared packages
        run: pnpm --filter "@workforce/shared-*" run build

      - name: Write .env for renderer
        shell: bash
        run: |
          cat > apps/desktop-agent/.env <<EOF
          VITE_API_BASE_URL=${{ github.event.inputs.api_url || 'https://workforce-system-backend.vercel.app/api' }}
          VITE_EMPLOYEE_DASHBOARD_URL=${{ github.event.inputs.dashboard_url || 'https://workforce-system-employee.vercel.app/dashboard' }}
          VITE_GH_UPDATE_TOKEN=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
          EOF

      - name: Build and Publish Mac app
        working-directory: apps/desktop-agent
        run: pnpm run build && pnpm exec electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Agent-Installer
          path: |
            apps/desktop-agent/dist-installer/*.dmg
            apps/desktop-agent/dist-installer/*.zip
            apps/desktop-agent/dist-installer/latest-mac.yml
