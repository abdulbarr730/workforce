name: Build Workforce Agent (.exe)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL (e.g. https://workforce-api.onrender.com)"
        required: true
        default: "http://localhost:5000"
      dashboard_url:
        description: "Employee dashboard URL (used when agent opens EOD in browser)"
        required: true
        default: "https://workforce-system-employee.vercel.app/dashboard"
  push:
    tags:
      - "agent-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared packages
        run: pnpm --filter "@workforce/shared-*" run build

      - name: Write .env for renderer
        shell: bash
        run: |
          cat > apps/desktop-agent/.env <<EOF
          VITE_API_URL=${{ github.event.inputs.api_url || 'http://localhost:5000' }}
          VITE_EMPLOYEE_DASHBOARD_URL=${{ github.event.inputs.dashboard_url || 'https://workforce-system-employee.vercel.app/dashboard' }}
          EOF

      - name: Build Windows installer
        working-directory: apps/desktop-agent
        run: pnpm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: workforce-agent-windows
          path: |
            apps/desktop-agent/dist-installer/*.exe
            apps/desktop-agent/dist-installer/*.exe.blockmap
          if-no-files-found: error

      - name: Attach to release (on tag push)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop-agent/dist-installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
