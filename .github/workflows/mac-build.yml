name: Build Mac Agent

on:
  workflow_dispatch: # Allows manual trigger ONLY

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "@workforce/shared-*" run build

      - name: Write .env for renderer
        shell: bash
        run: |
          cat > apps/desktop-agent/.env <<EOF
          VITE_API_BASE_URL=https://api.prosyncedu.com/api
          VITE_EMPLOYEE_DASHBOARD_URL=https://prosyncteam.onrender.com/dashboard
          EOF

      - name: Build and Publish Mac
        working-directory: apps/desktop-agent
        run: pnpm run build && pnpm exec electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          
      - name: Upload Mac Installers
        uses: actions/upload-artifact@v4
        with:
          name: Workforce-Agent-Mac
          path: |
            apps/desktop-agent/dist-installer/*.dmg
            apps/desktop-agent/dist-installer/*.zip
